# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.jitsi_base_url: 'https://meet.jit.si'
    app.external_ai_url: '%env(default::EXTERNAL_AI_API_URL)%'
    app.external_ai_key: '%env(default::EXTERNAL_AI_API_KEY)%'
    app.external_ai_model: '%env(default::EXTERNAL_AI_MODEL)%'
    app.external_ai_timeout: 25
    app.external_ai_max_candidates: 3
    app.facebook_page_id: '%env(default::FACEBOOK_PAGE_ID)%'
    app.facebook_page_access_token: '%env(default::FACEBOOK_PAGE_ACCESS_TOKEN)%'
    app.facebook_graph_api_version: '%env(default::FACEBOOK_GRAPH_API_VERSION)%'
    app.public_base_url: '%env(default::APP_PUBLIC_BASE_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true
        autoconfigure: true

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\CandidateCvManager:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\JitsiMeetService:
        arguments:
            $baseUrl: '%app.jitsi_base_url%'

    App\Service\ExternalAiRecruitmentAnalyzer:
        arguments:
            $apiUrl: '%app.external_ai_url%'
            $apiKey: '%app.external_ai_key%'
            $model: '%app.external_ai_model%'
            $timeoutSeconds: '%app.external_ai_timeout%'

    App\Service\CvMatchingService:
        arguments:
            $advancedAiMaxCandidates: '%app.external_ai_max_candidates%'

    App\Service\FacebookJobPublisher:
        arguments:
            $pageId: '%app.facebook_page_id%'
            $pageAccessToken: '%app.facebook_page_access_token%'
            $graphApiVersion: '%app.facebook_graph_api_version%'
            $publicBaseUrl: '%app.public_base_url%'

    Smalot\PdfParser\Parser: ~

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
