# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\FeedbackAutoResponseGenerator:
        arguments:
            $openAiApiKey: '%env(OPENAI_API_KEY)%'
            $openAiModel: '%env(OPENAI_MODEL)%'

    App\Service\FeedbackPriorityAnalyzer:
        arguments:
            $openAiApiKey: '%env(OPENAI_API_KEY)%'
            $openAiModel: '%env(OPENAI_MODEL)%'

    App\Service\AIService:
        arguments:
            $groqApiKey: '%env(GROQ_API_KEY)%'

    App\Service\ChatbotService:
        arguments:
            $groqApiKey: '%env(GROQ_API_KEY)%'

    App\Service\CandidateCvManager:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Smalot\PdfParser\Parser: ~

    App\Service\PdfCvPreviewService:
        arguments:
            $parser: '@Smalot\PdfParser\Parser'

    App\Service\PythonCvRankingService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $pythonBinary: 'python3'

    App\Service\ExternalAiRecruitmentAnalyzer:
        arguments:
            $apiUrl: '%env(EXTERNAL_AI_API_URL)%'
            $apiKey: '%env(EXTERNAL_AI_API_KEY)%'
            $model: '%env(EXTERNAL_AI_MODEL)%'

    App\Service\MeaningCloudSentimentService:
        arguments:
            $apiKey: '%env(MEANINGCLOUD_API_KEY)%'
            $apiUrl: '%env(MEANINGCLOUD_API_URL)%'

    App\Service\FacebookJobPublisher:
        arguments:
            $pageId: '%env(FACEBOOK_PAGE_ID)%'
            $pageAccessToken: '%env(FACEBOOK_PAGE_ACCESS_TOKEN)%'
            $graphApiVersion: '%env(resolve:FACEBOOK_GRAPH_API_VERSION)%'
            $publicBaseUrl: '%env(resolve:APP_PUBLIC_BASE_URL)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
